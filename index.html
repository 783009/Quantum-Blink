<!DOCTYPE html>
<html>
<head>
    <title>Quantum Blink</title>
    <script src="processing.min.js"></script>
    <style>
        body {
            background-color: #0c141c; 
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden; 
        }
        canvas {
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.3); 
            width: 100vw !important;
            height: 100vh !important;
            object-fit: contain !important; 
            outline: none; 
        }
    </style>
</head>
<body>
    <canvas id="gameCanvas" data-processing-sources="Quantum_Blink.pde Aestetics.pde Core_Logic.pde Classes.pde LEVEL_1.pde Level_2.pde Level_3.pde Level_4.pde Level_5.pde Level_6.pde Level_7.pde Level_8.pde Level_9.pde Level_10.pde UI.pde"></canvas>

    <script>
        const canvas = document.getElementById('gameCanvas');

        // Focus the canvas immediately when clicked
        window.addEventListener('click', () => {
            window.focus();
            canvas.focus();
        });

        // RECALCULATE MOUSE COORDINATES FOR HOVERS AND CLICKS
        function fixMouseCoordinates(e) {
            const pInstance = Processing.getInstanceById('gameCanvas');
            if (!pInstance) return;

            const rect = canvas.getBoundingClientRect();
            
            // Get original Processing sketch size
            const sketchWidth = pInstance.width;
            const sketchHeight = pInstance.height;

            // Calculate scaled dimensions inside object-fit: contain
            const canvasRatio = sketchWidth / sketchHeight;
            const elementRatio = rect.width / rect.height;
            
            let actualWidth, actualHeight, offsetX, offsetY;
            
            if (elementRatio > canvasRatio) {
                actualHeight = rect.height;
                actualWidth = rect.height * canvasRatio;
                offsetX = rect.left + (rect.width - actualWidth) / 2;
                offsetY = rect.top;
            } else {
                actualWidth = rect.width;
                actualHeight = rect.width / canvasRatio;
                offsetX = rect.left;
                offsetY = rect.top + (rect.height - actualHeight) / 2;
            }

            // Map standard browser mouse coordinates directly to Processing space
            const calcX = Math.round(((e.clientX - offsetX) / actualWidth) * sketchWidth);
            const calcY = Math.round(((e.clientY - offsetY) / actualHeight) * sketchHeight);

            // FORCE PASSTHROUGH DIRECTLY INTO PROCESSING VARIABLES (Fixes Hover Highlights)
            pInstance.mouseX = calcX;
            pInstance.mouseY = calcY;
            
            // Also override the engine data inputs to match
            if (pInstance.__mouseX !== undefined) pInstance.__mouseX = calcX;
            if (pInstance.__mouseY !== undefined) pInstance.__mouseY = calcY;
        }

        // Keep updating on movement, hover, and click frames
        window.addEventListener('mousemove', fixMouseCoordinates, true);
        window.addEventListener('mousedown', fixMouseCoordinates, true);
        window.addEventListener('mouseup', fixMouseCoordinates, true);
    </script>
</body>
</html>
